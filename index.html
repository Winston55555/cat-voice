<style>
*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;background:#11100e;color:#f5ede2;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{height:100dvh;display:grid;grid-template-columns:1fr 1fr}.library{grid-column:2;min-width:0;overflow-y:auto;padding:8px 14px 24px}.portrait{grid-column:1;grid-row:1;min-width:0;background:#17130f;overflow:hidden}
.portrait video{width:100%;height:100%;display:block;object-fit:cover;object-position:center 36%}.row{display:grid;grid-template-columns:34px minmax(150px,220px) 1fr;align-items:center;gap:7px;padding:5px 4px;border-bottom:1px solid #29231f}
.row:hover{background:#1a1714}.num{font:700 16px ui-monospace;color:#e6a764}.name{font-weight:650;line-height:1.15}audio{width:100%;height:32px}.chevron{width:28px;height:28px;padding:0;border:0;border-radius:7px;background:transparent;color:#e6a764;font:700 28px/24px system-ui;cursor:pointer;transition:transform .16s ease}.chevron[aria-expanded="true"]{transform:rotate(90deg)}.variant{padding-left:13px;background:#171411;border-color:#302921}.variant .name{color:#d8c9bb;font-weight:550}.branch{color:#8f7764;font-size:17px}.variants:empty{display:none}.voice-group:has(.variants:empty) .chevron{opacity:.42}

</style></head><body><main class="app"><section class="library"><div class="row original"><span class="num">00</span><span class="name">Оригинал</span><audio controls preload="metadata" src="original.mp3"></audio></div><section class="voice-group"><div class="row voice-head"><button class="chevron" aria-expanded="false" aria-label="Развернуть варианты Puck">›</button><span class="name">Puck</span><audio controls preload="metadata" src="standard-voices/01-Puck.wav"></audio></div><div class="variants" hidden></div></section><section class="voice-group"><div class="row voice-head"><button class="chevron" aria-expanded="false" aria-label="Развернуть варианты Charon">›</button><span class="name">Charon</span><audio controls preload="metadata" src="standard-voices/02-Charon.wav"></audio></div><div class="variants" hidden></div></section><section class="voice-group"><div class="row voice-head"><button class="chevron" aria-expanded="false" aria-label="Развернуть варианты Fenrir">›</button><span class="name">Fenrir</span><audio controls preload="metadata" src="standard-voices/03-Fenrir.wav"></audio></div><div class="variants" hidden></div></section><section class="voice-group"><div class="row voice-head"><button class="chevron" aria-expanded="false" aria-label="Развернуть варианты Orus">›</button><span class="name">Orus</span><audio controls preload="metadata" src="standard-voices/04-Orus.wav"></audio></div><div class="variants" hidden></div></section><section class="voice-group"><div class="row voice-head"><button class="chevron" aria-expanded="false" aria-label="Развернуть варианты Enceladus">›</button><span class="name">Enceladus</span><audio controls preload="metadata" src="standard-voices/05-Enceladus.wav"></audio></div><div class="variants" hidden></div></section><section class="voice-group"><div class="row voice-head"><button class="chevron" aria-expanded="false" aria-label="Развернуть варианты Iapetus">›</button><span class="name">Iapetus</span><audio controls preload="metadata" src="standard-voices/06-Iapetus.wav"></audio></div><div class="variants" hidden></div></section><section class="voice-group"><div class="row voice-head"><button class="chevron" aria-expanded="false" aria-label="Развернуть варианты Umbriel">›</button><span class="name">Umbriel</span><audio controls preload="metadata" src="standard-voices/07-Umbriel.wav"></audio></div><div class="variants" hidden></div></section><section class="voice-group"><div class="row voice-head"><button class="chevron" aria-expanded="false" aria-label="Развернуть варианты Algieba">›</button><span class="name">Algieba</span><audio controls preload="metadata" src="standard-voices/08-Algieba.wav"></audio></div><div class="variants" hidden></div></section><section class="voice-group"><div class="row voice-head"><button class="chevron" aria-expanded="false" aria-label="Развернуть варианты Algenib">›</button><span class="name">Algenib</span><audio controls preload="metadata" src="standard-voices/09-Algenib.wav"></audio></div><div class="variants" hidden></div></section><section class="voice-group"><div class="row voice-head"><button class="chevron" aria-expanded="false" aria-label="Развернуть варианты Rasalgethi">›</button><span class="name">Rasalgethi</span><audio controls preload="metadata" src="standard-voices/10-Rasalgethi.wav"></audio></div><div class="variants" hidden></div></section><section class="voice-group"><div class="row voice-head"><button class="chevron" aria-expanded="false" aria-label="Развернуть варианты Alnilam">›</button><span class="name">Alnilam</span><audio controls preload="metadata" src="standard-voices/11-Alnilam.wav"></audio></div><div class="variants" hidden></div></section><section class="voice-group"><div class="row voice-head"><button class="chevron" aria-expanded="false" aria-label="Развернуть варианты Schedar">›</button><span class="name">Schedar</span><audio controls preload="metadata" src="standard-voices/12-Schedar.wav"></audio></div><div class="variants" hidden></div></section><section class="voice-group"><div class="row voice-head"><button class="chevron" aria-expanded="false" aria-label="Развернуть варианты Achird">›</button><span class="name">Achird</span><audio controls preload="metadata" src="standard-voices/13-Achird.wav"></audio></div><div class="variants" hidden></div></section><section class="voice-group"><div class="row voice-head"><button class="chevron" aria-expanded="false" aria-label="Развернуть варианты Zubenelgenubi">›</button><span class="name">Zubenelgenubi</span><audio controls preload="metadata" src="standard-voices/14-Zubenelgenubi.wav"></audio></div><div class="variants" hidden></div></section><section class="voice-group"><div class="row voice-head"><button class="chevron" aria-expanded="false" aria-label="Развернуть варианты Sadachbia">›</button><span class="name">Sadachbia</span><audio controls preload="metadata" src="standard-voices/15-Sadachbia.wav"></audio></div><div class="variants" hidden></div></section><section class="voice-group"><div class="row voice-head"><button class="chevron" aria-expanded="false" aria-label="Развернуть варианты Sadaltager">›</button><span class="name">Sadaltager</span><audio controls preload="metadata" src="standard-voices/16-Sadaltager.wav"></audio></div><div class="variants" hidden></div></section></section><aside class="portrait"><video id="cat-video" muted playsinline preload="auto" poster="cat.png"><source src="cat-video.mp4" type="video/mp4"></video></aside></main>
<script>
const players=[...document.querySelectorAll('audio')];
const catVideo=document.querySelector('#cat-video');
for(const player of players){
  player.addEventListener('play',()=>{
    for(const other of players) if(other!==player){other.pause();other.currentTime=0}
    catVideo.playbackRate=1;catVideo.currentTime=player.currentTime;catVideo.play().catch(()=>{});
  });
  player.addEventListener('pause',()=>{if(!players.some(p=>!p.paused)) catVideo.pause()});
  player.addEventListener('ended',()=>{catVideo.pause();catVideo.currentTime=0});
  player.addEventListener('seeking',()=>{if(Number.isFinite(catVideo.duration)) catVideo.currentTime=Math.min(player.currentTime,catVideo.duration)});
}
for(const button of document.querySelectorAll('.chevron')){
  button.addEventListener('click',()=>{
    const variants=button.closest('.voice-group').querySelector('.variants');
    const expanded=button.getAttribute('aria-expanded')==='true';
    button.setAttribute('aria-expanded',String(!expanded));
    variants.hidden=expanded;
  });
}
</script></body></html>
