<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<title>Cat Voice</title>
<style>
*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;background:#11100e;color:#f5ede2;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{height:100dvh;display:grid;grid-template-columns:1fr 1fr}.library{grid-column:2;min-width:0;overflow-y:auto;padding:12px 14px 24px}.portrait{grid-column:1;grid-row:1;min-width:0;background:#17130f;overflow:hidden}
.portrait video{width:100%;height:100%;display:block;object-fit:cover;object-position:center 42%}.tabs{position:sticky;top:-12px;z-index:2;display:flex;gap:7px;overflow-x:auto;background:#11100e;border-bottom:1px solid #3a3129;padding:12px 0 8px;margin-bottom:5px}
.tab{border:1px solid #4a3b30;background:#211c18;color:#cdbbaa;border-radius:9px;padding:8px 16px;font-weight:700;cursor:pointer;white-space:nowrap}
.tab.active{background:#b87538;color:#fff;border-color:#d99452}.row{display:grid;grid-template-columns:34px minmax(120px,190px) 1fr;align-items:center;gap:7px;padding:5px 4px;border-bottom:1px solid #29231f}
.row:hover{background:#1a1714}.num{font:700 16px ui-monospace;color:#e6a764}.name{font-weight:650;line-height:1.15}audio{width:100%;height:32px}[hidden]{display:none!important}
@media(max-width:720px){.app{grid-template-columns:1fr;grid-template-rows:48dvh 52dvh}.portrait{grid-column:1;grid-row:1}.portrait video{object-position:center 12%}.library{grid-column:1;grid-row:2;padding:8px 10px 20px}.tabs{top:-8px;padding-top:8px}.row{grid-template-columns:30px minmax(105px,145px) 1fr;gap:5px;padding:4px 2px}audio{height:30px}}
</style></head><body><main class="app"><section class="library"><nav class="tabs"><button class="tab active" data-panel="panel-0">Achird</button></nav><section id="panel-0" class="panel"><div class="row original"><span class="num">00</span><span class="name">Оригинал</span><audio controls preload="metadata" src="original.mp3"></audio></div><div class="row"><span class="num">01</span><span class="name">Сдержанный циник</span><audio controls preload="metadata" src="Achird 01/01.wav"></audio></div><div class="row"><span class="num">02</span><span class="name">Заговорщик</span><audio controls preload="metadata" src="Achird 01/02.wav"></audio></div><div class="row"><span class="num">03</span><span class="name">Сухой стендап</span><audio controls preload="metadata" src="Achird 01/03.wav"></audio></div><div class="row"><span class="num">04</span><span class="name">Мудрый наглец</span><audio controls preload="metadata" src="Achird 01/04.wav"></audio></div><div class="row"><span class="num">05</span><span class="name">Энергичный интеллектуал</span><audio controls preload="metadata" src="Achird 01/05.wav"></audio></div><div class="row"><span class="num">06</span><span class="name">Абсурдно серьёзный</span><audio controls preload="metadata" src="Achird 01/06.wav"></audio></div><div class="row"><span class="num">07</span><span class="name">Хитрый рассказчик</span><audio controls preload="metadata" src="Achird 01/07.wav"></audio></div><div class="row"><span class="num">08</span><span class="name">Ночной чёрный юмор</span><audio controls preload="metadata" src="Achird 01/08.wav"></audio></div></section></section><aside class="portrait"><video id="cat-video" muted playsinline preload="auto" poster="cat.png"><source src="cat-video.mp4" type="video/mp4"></video></aside></main>
<script>
const players=[...document.querySelectorAll('audio')];
const catVideo=document.querySelector('#cat-video');
for(const player of players){
  player.addEventListener('play',()=>{
    for(const other of players) if(other!==player){other.pause();other.currentTime=0}
    catVideo.playbackRate=1;
    catVideo.currentTime=player.currentTime;
    catVideo.play().catch(()=>{});
  });
  player.addEventListener('pause',()=>{if(!players.some(p=>!p.paused)) catVideo.pause()});
  player.addEventListener('ended',()=>{catVideo.pause();catVideo.currentTime=0});
  player.addEventListener('seeking',()=>{if(Number.isFinite(catVideo.duration)) catVideo.currentTime=Math.min(player.currentTime,catVideo.duration)});
}
for(const tab of document.querySelectorAll('.tab')) tab.addEventListener('click',()=>{
  for(const t of document.querySelectorAll('.tab')) t.classList.remove('active'); tab.classList.add('active');
  for(const panel of document.querySelectorAll('.panel')) panel.hidden=panel.id!==tab.dataset.panel;
});
</script></body></html>
